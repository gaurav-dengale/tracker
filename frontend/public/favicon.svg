<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e40af" flood-opacity="0.6"/>
    </filter>

    <filter id="capShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#glow)" />

  <!-- Subtle Inner Border -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />

  <!-- Decorative Target / Progress Arc -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8" stroke-dasharray="16 12" />

  <g filter="url(#capShadow)">
    <!-- Graduation Cap Diamond / Top -->
    <polygon points="256,120 408,196 256,272 104,196" fill="#ffffff" />

    <!-- Cap Crown Underneath -->
    <path d="M168,228 L168,300 C168,340 344,340 344,300 L344,228 L256,272 Z" fill="#e2e8f0" />

    <!-- Tassel String -->
    <path d="M256,196 C300,196 380,240 388,284" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" />
    
    <!-- Tassel Bob / Ring -->
    <circle cx="256" cy="196" r="8" fill="#f59e0b" />
    <polygon points="388,284 378,340 398,340" fill="#f59e0b" />
  </g>

  <!-- Glowing Checkmark Badge in Bottom Right -->
  <g transform="translate(320, 320)">
    <circle cx="56" cy="56" r="56" fill="#10b981" filter="url(#capShadow)" stroke="#ffffff" stroke-width="6" />
    <!-- Checkmark path -->
    <path d="M34,58 L49,73 L78,41" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>